name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      # 環境変数は起動時に検証される(ADR-014)。ビルドが通ることだけを見るため、
      # 形式だけ満たすダミー値を渡す。実値は Vercel / GitHub Secrets 側にある。
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-build-only
          SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key-for-build
          ANTHROPIC_API_KEY: sk-ant-dummy-for-build-only
          DISCORD_WEBHOOK_URL: https://discord.com/api/webhooks/0/dummy
          CRON_SECRET: dummy-cron-secret-for-build-only-0123456789

  schema:
    name: schema (constraints / functions / RLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # ランナーには PostgreSQL 16 が同梱されているが、無い場合に備えて入れる
      - name: Ensure PostgreSQL
        run: |
          if ! ls -d /usr/lib/postgresql/*/bin >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16
          fi

      - name: Verify schema
        run: ./scripts/verify-schema.sh

      # docs/schema.sql と supabase/migrations/ は両方が正。片方だけ更新すると
      # 本番と設計書が静かにずれるため、同じスキーマを作ることを毎回確かめる。
      - name: Verify migrations match docs/schema.sql
        run: ./scripts/verify-migrations.sh

      # 本人が SQL Editor へ貼る supabase/apply-pending.sql は migrations/ の写し。
      # 写しは放っておけばずれるため、同じスキーマを作ることを毎回確かめる。
      - name: Verify apply-pending.sql matches the pending migrations
        run: ./scripts/verify-apply-pending.sh
