name: Morning Brief

# 朝配信ジョブ(毎朝07:00 JST = 22:00 UTC、M5-2)。当日分の配信を生成し、
# Discord Webhook が設定済みなら送信する。Actions の遅延で07:15頃に走っても
# `daily_briefs.status='delivered'` を正とするため二重送信しない(route 側)。
# Webhook 未設定(B-3 待ち)でも生成自体は進む(route 側が送信だけスキップする)。

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  morning-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/morning-brief
        run: |
          status=$(curl -sS -o /tmp/response.json -w '%{http_code}' \
            -X POST "${APP_BASE_URL}/api/cron/morning-brief" \
            -H "Authorization: Bearer ${CRON_SECRET}")
          cat /tmp/response.json
          if [ "$status" -ge 300 ]; then
            echo "::error::morning-brief がステータス $status を返しました"
            exit 1
          fi
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
