name: Sync Google

# Google連携ジョブ(毎日07:30 JST = 22:30 UTC、①③)。カレンダー同期
# (給料日・サブスク更新日・完済予定日)は毎回実行、スプレッドシートへの
# 月次バックアップは月末だけ実際に書き込む(route 側の isLastDayOfMonth()
# 判定、P6-3 の net_worth_snapshots と同じ相乗り設計)。
# Google 連携未設定(本人が /settings/google での同意をまだ済ませていない)
# 間はスキップするだけで、ジョブ自体は失敗させない(route 側)。

on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:

jobs:
  sync-google:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/sync-google
        run: |
          status=$(curl -sS -o /tmp/response.json -w '%{http_code}' \
            -X POST "${APP_BASE_URL}/api/cron/sync-google" \
            -H "Authorization: Bearer ${CRON_SECRET}")
          cat /tmp/response.json
          if [ "$status" -ge 300 ]; then
            echo "::error::sync-google がステータス $status を返しました"
            exit 1
          fi
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
