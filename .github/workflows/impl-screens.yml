name: impl-screens

# 実装の全画面をサンプルデータで描画して取り込む(デザインのキャンバス用の一時ブランチでだけ動く)。
on:
  push:
    branches: ['claude/impl-screens-capture']

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Postgres の拡張(pg_trgm など)
        run: |
          ls /usr/lib/postgresql/
          V=$(ls /usr/lib/postgresql | sort -V | tail -1)
          [ -f /usr/share/postgresql/$V/extension/pg_trgm.control ] || sudo apt-get install -y postgresql-contrib

      - name: Playwright(Chromium)
        run: |
          npm i --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk

      - name: 全画面を描画して取り込む
        run: bash scripts/impl-capture/run.sh

      - name: 結果をこのブランチに置く
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git add -f impl-capture-out
          git commit -m 'Add captured screens' || exit 0
          git push
